{% extends 'base.html' %}

{% block content %}
<h1>Подтверждение удаления слота</h1>

<p>Вы уверены, что хотите удалить слот?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'client:all_slots' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
