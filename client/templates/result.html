{% extends 'base.html' %}

{% block content %}
<h1>Добавление результата диагностики</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>

<p><a href="{% url 'client:result_list' %}">Вернуться к списку результатов</a></p>
{% endblock %}
