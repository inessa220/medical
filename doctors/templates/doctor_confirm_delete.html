{% extends 'base.html' %}
{% block content %}
<body>
    <h1>Удалить врача "{{ doctor.last_name }} {{ doctor.first_name }} {{ doctor.patronymic }}"?</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'doctors:doctor_list' %}">Отмена</a>
    </form>
</body>
{% endblock %}
