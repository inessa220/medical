<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диагностический центр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fafafa;
            background-image: url('/media/img_1.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: -1;
        }

        h2 {
            color: #4682B4;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            font-size: 1rem;
            width: 100%;
        }

        .btn-custom {
            background-color: #4682B4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease-in-out;
        }

        .btn-custom:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .btn-custom:focus,
        .btn-custom.active {
            outline: none;
            box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.1);
        }

        .btn-custom.disabled,
        .btn-custom[disabled],
        fieldset[disabled] .btn-custom {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .sidebar {
            position: fixed;
            background-color: #4682B4  !important;
            color: white;
            padding-top: 20px;
            height: 100vh;
            width: 300px;
        }

        .sidebar a {
            color: white;
            padding: 10px 20px;
            display: block;
            text-decoration: none;
        }

        .sidebar a:hover {
            background-color: #A3DEF0 !important;
            color: black !important;
        }

        .sidebar a.active {
            background-color: #BDBDBD !important;
        }

        body#home #home-link,
        body#company #company-link,
        body#doctors #doctors-link,
        body#services #services-link,
        body#contact #contact-link {
            background-color: #BDBDBD;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4682B4;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        td {
            background-color: #fafafa;
            padding: 10px;
            vertical-align: middle;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #EAF3FA;
            cursor: pointer;
        }

        tr.active {
            background-color: #A3DEF0;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

    </style>
</head>
<body id="{% block body_id %}{% endblock %}">

<div class="overlay"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Боковая панель -->
        <nav id="sidebarMenu" class="col-md-1 col-lg-1 bg-dark sidebar collapse d-md-block">
            <div class="position-sticky pt-3">
                <h5 class="mb-3 text-white"><span class="fas fa-bars me-2"></span> Диагностический центр</h5>
                <hr />
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="{% url 'doctors:home' %}" id="home-link">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'doctors:company' %}" id="company-link">О компании</a>
                    </li>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'doctors:doctor_list' %}" id="doctors-link">Команда врачей</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'service:service_list' %}" id="services-link">Услуги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'doctors:contact' %}" id="contact-link">Контакты</a>
                    </li>
                </ul>
                <hr class="my-3" />
                <ul class="nav nav-pills flex-column">
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:logout' %}">Выход</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:account' %}">Личный кабинет</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:login' %}">Авторизация</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </nav>
        <!-- Основной контент -->
        <main class="col-md-10 ms-sm-auto col-lg-10 px-md-4 py-4">
        {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
